      h("div",{className:"t"},h("div",{className:"cat"},"PICK UP · "+game.category),h("h2",null,game.title),h("p",null,game.description),
        h("button",{className:"btn",onClick:()=>onPlay(game.id),"aria-label":game.title+"を今すぐ遊ぶ"},"今すぐ遊ぶ")),
      game.thumbnail())));
}
function GameCard({game,fav,toggleFav,onPlay}){
  return h("article",{className:"card"},game.thumbnail(),
    h("div",{className:"b"},h("h3",null,game.title),h("p",null,game.description),
      h("div",{className:"meta"},h("span",null,game.category),h("span",null,"·"),h("span",null,game.estimatedPlayTime)),
      h("div",{className:"row"},h("button",{className:"btn",onClick:()=>onPlay(game.id),"aria-label":game.title+"をプレイ"},"プレイ"),
        h("button",{className:"fav","aria-pressed":fav,"aria-label":fav?"お気に入りから外す":"お気に入りに追加",onClick:()=>toggleFav(game.id)},fav?"★":"☆"))));
}
function GameGrid({games,favs,toggleFav,onPlay,reset}){
  if(!games.length)return h("div",{className:"empty",role:"status"},h("b",null,"該当するゲームがありません"),"検索ワードやカテゴリを変更してください。",h("div",{style:{marginTop:16}},h("button",{className:"btn sub",onClick:reset},"条件をリセット")));
  return h("div",{className:"grid"},games.map(g=>h(GameCard,{key:g.id,game:g,fav:favs.includes(g.id),toggleFav,onPlay})));
}
function Library({q,cat,setCat,favOnly,setFavOnly,favs,toggleFav,onPlay,reset}){
  const list=useMemo(()=>{const k=q.trim().toLowerCase();return publicGames().filter(g=>(cat==="すべて"||g.category===cat)&&(!favOnly||favs.includes(g.id))&&(!k||(g.title+" "+g.description).toLowerCase().includes(k)))},[q,cat,favOnly,favs]);
  return h("section",{className:"lib",id:"library"},h("div",{className:"wrap"},
    h("h2",null,favOnly?"お気に入り":"ゲームライブラリ"),h("p",{className:"sub"},list.length+" 件のゲーム"),
    h("div",{className:"chips",id:"category",role:"group","aria-label":"カテゴリ"},CATEGORIES.map(c=>h("button",{key:c,className:"chip","aria-pressed":cat===c,onClick:()=>setCat(c)},c))),
    h(GameGrid,{games:list,favs,toggleFav,onPlay,reset})));
}
function GameLayout({game,onBack,fav,toggleFav}){
  const [st,setSt]=useState({status:"開始前",score:null});
  const [best,setBest]=useState(()=>store.get("best:"+game.id,null));
  const ctx=useMemo(()=>({best,report(p){
    if(p.status)setSt(s=>({...s,status:p.status}));
    if(p.score!=null){setSt(s=>({...s,score:p.score}));setBest(b=>{const n=b==null?p.score:game.lowerIsBetter?Math.min(b,p.score):Math.max(b,p.score);store.set("best:"+game.id,n);return n})}
  }}),[best,game]);
  const Game=getComp(game);
  return h("div",{className:"page gp"},h("div",{className:"wrap"},
    h("div",{className:"top"},h("button",{className:"btn sub",onClick:onBack},"← ゲーム一覧"),
      h("button",{className:"fav","aria-pressed":fav,"aria-label":fav?"お気に入りから外す":"お気に入りに追加",onClick:()=>toggleFav(game.id)},fav?"★":"☆")),
    h("h1",null,game.title),h("p",{className:"desc"},game.description),
    h("div",{className:"stats"},
      h("div",{className:"stat"},h("small",null,"状態"),h("b",null,st.status)),
      h("div",{className:"stat"},h("small",null,game.scoreLabel||"スコア"),h("b",null,st.score==null?"—":st.score)),
      h("div",{className:"stat"},h("small",null,game.bestLabel||"ベスト"),h("b",null,best==null?"—":best))),
    h(Boundary,{key:game.id,onBack},h(Suspense,{fallback:h("div",{className:"spin",role:"status","aria-label":"読み込み中"})},h(Game,{ctx})))));
}

/* ===== pages / app ===== */
function App(){
  const parse=()=>{const m=location.hash.match(/^#game-(.+)$/);return m?m[1]:""};
  const [gid,setGid]=useState(parse);
  const [setp,setSetp]=useState(()=>location.hash==="#settings");
  const [theme,setThm]=useState(()=>{const d=document.documentElement;if(!d.dataset.theme)d.dataset.theme="dark";return d.dataset.theme});
  const ttr=useRef(0);
  const setTheme=t=>{const d=document.documentElement;clearTimeout(ttr.current);d.classList.add("tt");d.dataset.theme=t;setThm(t);store.set("pg:theme",t);ttr.current=setTimeout(()=>d.classList.remove("tt"),500)};
  const [q,setQ]=useState(""),[cat,setCat]=useState("すべて"),[favOnly,setFavOnly]=useState(false);
  const [favs,setFavs]=useState(()=>store.get("favs",[]));
  const searchRef=useRef(null),pending=useRef(null);
  useEffect(()=>{const f=()=>{setGid(parse());setSetp(location.hash==="#settings");window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
  useEffect(()=>{if(!gid&&!setp&&pending.current){const id=pending.current;pending.current=null;requestAnimationFrame(()=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})})}});
  const nav=(to,anchor)=>{pending.current=anchor||null;if(to===""&&!gid){if(anchor){const el=document.getElementById(anchor);el&&el.scrollIntoView({behavior:"smooth"});pending.current=null}else window.scrollTo({top:0,behavior:"smooth"});return}
    location.hash=to?"game-"+to:"";if(!to&&!location.hash)setGid("")};
  const toggleFav=useCallback(id=>setFavs(f=>{const n=f.includes(id)?f.filter(x=>x!==id):[...f,id];store.set("favs",n);return n}),[]);
  const play=id=>{location.hash="game-"+id};
  const game=gid?publicGames().find(g=>g.id===gid):null;
  const reset=()=>{setQ("");setCat("すべて");setFavOnly(false)};
  const pick=publicGames()[0];
  return h(React.Fragment,null,
    h(Header,{route:gid,settings:setp,nav:(t,a)=>{if(gid||setp){pending.current=a||null;location.hash=""}else nav(t,a)},q,setQ,favOnly,setFavOnly,searchRef}),
    h("main",null,setp?h(Settings,{theme,setTheme}):gid?(game?h(GameLayout,{key:game.id,game,onBack:()=>{pending.current="library";location.hash=""},fav:favs.includes(game.id),toggleFav})
        :h("div",{className:"wrap page gp"},h("div",{className:"err",role:"alert"},h("b",null,"ゲームが見つかりません"),h("p",null,"URLが正しくないか、公開されていません。"),h("button",{className:"btn",onClick:()=>{location.hash=""}},"ゲーム一覧へ戻る"))))
      :h("div",{className:"page"},h(Hero,{game:pick,onPlay:play}),h(Library,{q,cat,setCat,favOnly,setFavOnly,favs,toggleFav,onPlay:play,reset}))),
    h("footer",null,"© "+SITE_NAME));
}
document.title=SITE_NAME;
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
